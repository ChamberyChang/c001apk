name: apk-dist

on:
  workflow_dispatch:

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle for CI
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Xms256m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.daemon=false
          org.gradle.workers.max=1
          org.gradle.configuration-cache=false
          kotlin.incremental=false
          kotlin.compiler.execution.strategy=in-process
          org.gradle.caching=true
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon --stacktrace --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx2g -Xms256m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pandroid.injected.build.abi=arm64-v8a \
            -x checkReleaseAarMetadata \
            -x checkKotlinGradlePluginConfigurationErrors \
            -x checkReleaseDuplicateClasses

      - name: Gather APKs into dist folder
        id: apk
        run: |
          mkdir -p dist
          find app/build/outputs -type f -name '*.apk' -exec cp -f {} dist/ \;
          ls -l dist
          echo "apk_count=$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" >> "$GITHUB_OUTPUT"
          if [ "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 0 ]; then
            echo "No APK file found under app/build/outputs"
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.apk.outputs.apk_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
