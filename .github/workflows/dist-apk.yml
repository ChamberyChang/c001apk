name: dist-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Gradle for stable Android release builds
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.parallel=false
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx2g -Xms256m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.incremental=false
          kotlin.compiler.execution.strategy=in-process
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK and AAB
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            --no-daemon --stacktrace --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx2g -Xms256m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pandroid.injected.build.abi=arm64-v8a \
            -x checkReleaseAarMetadata \
            -x checkKotlinGradlePluginConfigurationErrors \
            -x checkReleaseDuplicateClasses

      - name: Produce a distributable APK from the build outputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist

          if find app/build -type f \( -iname "*.apk" -o -iname "*.aab" -o -iname "*.apks" \) 2>/dev/null | grep -q .; then
            echo "Discovered Android build artifacts:"
            find app/build -type f \( -iname "*.apk" -o -iname "*.aab" -o -iname "*.apks" \) -print | sort
          else
            echo "No APK/AAB/APKS artifact found under app/build after the release build."
            exit 1
          fi

          APK_FOUND=0
          find app/build -type f -iname "*.apk" -exec cp -f {} dist/ \; || true
          if find dist -type f -iname "*.apk" | grep -q .; then
            APK_FOUND=1
          fi

          if [ "$APK_FOUND" -eq 0 ]; then
            BUNDLE_PATH=$(find app/build -type f -iname "*.aab" | head -n 1)
            if [ -z "$BUNDLE_PATH" ]; then
              echo "No .aab bundle file was produced either."
              exit 1
            fi

            curl -fsSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar
            java -jar bundletool.jar build-apks \
              --bundle="$BUNDLE_PATH" \
              --output=dist/app.apks \
              --ks=app/c001apk.jks \
              --ks-pass=pass:123456 \
              --ks-key-alias=c001apk \
              --key-pass=pass:123456 \
              --mode=universal
            unzip -o dist/app.apks -d dist >/dev/null
          fi

          echo "Final dist contents:"
          find dist -maxdepth 2 -type f -iname "*.apk" -print | sort
          if ! find dist -type f -iname "*.apk" | grep -q .; then
            echo "No APK is available for distribution after conversion."
            exit 1
          fi

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dist-${{ github.run_number }}
          name: c001apk-dist-${{ github.run_number }}
          files: |
            dist/*.apk
          generate_release_notes: true
